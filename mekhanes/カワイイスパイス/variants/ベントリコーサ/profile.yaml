name: ベントリコーサ
reading: べんとりこーさ
aliases:
  - カワイイスパイス（悪落ち）
variant:
  source: カワイイスパイス
  continuity: ノワルミアによる「所有」が成立した後の悪落ち分岐。
  status: キャラクター設定初稿
profile:
  personality: >-
    いおどを自らの手で死なせたことを悔いている。
    その喪失を理解し、後悔を抱えたまま、それでも飢えが止まらない。
    ルノフェットも、ピュリファイアでさえも、彼女の眼中には入っていない。
    ただ喪失を悲しみ、飢えている。
    悔恨と飢餓が同時に存在していることが、変貌後の彼女の人格の核となる。
  speech:
    manner: >-
      誰とも目が合わず、独り言のように言葉がこぼれる。
      飢えの訴えと、いおどへの謝罪に、悲しみがそのまま表れる。
    examples:
      - 「……おなか、すいた。……いおど、ごめんね」
  appearance: >-
    人間態・怪人態・怪物態の三形態を持つ。
    人間態では元のショッキングピンクの髪の根元が緑色となり、白目にあたる部分が黒くなっている。
    怪人態では下半身正面がウツボカズラと化し、植物の側が本体、上半身が獲物を誘う疑似餌となる。
    怪物態ではウツボカズラそのものの姿を取り、複数の大鎌を触手で操る。
  ability:
    - 魔災害因子との融合: >-
        凶悪かつ巨大な食虫植物のような魔災害因子を受け入れた。
    - 捕食: >-
        涜船エグジラを飲み込み、ノワルミアをも喰らう。
    - 疑似餌: >-
        怪人態の上半身を使い、本体であるウツボカズラへ獲物を誘い込む。
    - 大鎌の召喚と操作: >-
        怪物態では、かつての彼女の象徴である大鎌を何本も呼び出し、触手で操る。
background: >-
  ノワルミアに「所有」され、一匹のサキュバスと化したカワイイスパイスの悪落ちバリエーション。
  所有された後、彼女はさらに改造を施され、魔災害因子を融合される。
  食虫植物を凶悪かつ巨大にしたような「それ」を受け入れた彼女は、涜船エグジラを飲み込み、
  ノワルミアをも喰らい、自らエグジラの女王となる。
  討伐対象となった彼女には「ベントリコーサ」の名が与えられた。
relations:
  - target: 黑入鹿イオド
    content: >-
      この分岐では死亡。カワイイスパイスが所有された後もしばらくは生存していたが、
      欲望を制御できなくなった彼女に生命を吸い尽くされる。
      彼女はその死を悔いているが、今も飢え続けている。
  - target: ルノフェット
    content: >-
      この分岐では尖兵化。カワイイスパイスを守る剣と化す。
      しかし、彼自身は彼女の眼中に入っていない。
  - target: ピュリファイア
    content: >-
      この分岐では眷属化。カワイイスパイスに堕とされる。
      ピュリファイアでさえも、今の彼女の眼中には入っていない。
  - target: ノワルミア
    content: >-
      この分岐では死亡。カワイイスパイスを所有していたが、
      やがて彼女から拷問を受け、徹底的に痛めつけられた末に喰われる。
  - target: 涜船エグジラ
    content: 飲み込んだ対象。ノワルミアに代わって、彼女自身がその女王となる。
forms:
  human:
    name: 人間態
    hair: ショッキングピンクのロングヘアを基調とし、髪の根元が緑色になっている。
    eyes: 白目にあたる部分が黒くなっている。
    costume: >-
      元の魔法少女衣装の輪郭と飾りの配置を残しながら、衣装自体が植物化している。
      布地には葉脈が浮き、裾や縁は肉厚な植物組織へと変質している。
      人間態でも植物化が目に見え、近づくと衣装が生きていると分かる。
  humanoid:
    name: 怪人態
    body: 下半身正面がウツボカズラと化している。
    true_body: ウツボカズラの方が本体。
    lure: 人型の上半身は獲物を誘い込むための疑似餌。
  monster:
    name: 怪物態
    body: ウツボカズラ。
    weapons: 彼女の象徴である大鎌を複数召喚し、触手で操る。
misc:
  二つ名: エグジラの女王
  討伐対象名: ベントリコーサ
