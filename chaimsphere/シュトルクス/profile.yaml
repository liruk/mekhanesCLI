name: シュトルクス
reading: しゅとるくす
aliases: []
profile:
  age: 未設定
  gender: 男性
  appearance: >-
    青白い毛並みを持つ、ボルゾイ犬をベースとした獣人男性。
    細身で長身。細長く突き出たマズルと青い瞳を持ち、口元には獰猛な牙が並ぶ。
    コーデュロイ生地の白いオフショルダーの縦セーターと、緑のチノパンを着用する。
    武器はオリハルコンクローで、左右の手に一本ずつ装備する。
  personality: >-
    慇懃にして獰猛、挑発的。礼儀正しい物腰の内に獰猛さを備え、
    丁寧な態度のまま相手を挑発する。
  ability:
  - 軽装戦士としての近接戦闘
  - 左右の手に一本ずつ装備したオリハルコンクローによる戦闘
  - 冷気の術
  speech_style: 慇懃な敬語を用い、丁寧な言い回しに挑発を織り交ぜる。
background:
- シュトルクスの活動名で冒険者として活動している。
- 主な活動地域はシュヴィルニャ地方。
- 冒険者ランクは金級。
