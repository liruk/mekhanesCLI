name: レギオン・オブ・ジェワール
reading: "れぎおん・おぶ・じぇわーる"
aliases:
  - Legion of Jewar
  - リビングデッドの使用人
  - ジェワールのメイドたち
profile:
  appearance: >-
    ジェワール邸に仕える、複数個体からなるリビングデッドの群体。
    全個体がメイド服をまとった女性の姿を取り、肌には色や質感の異なる部位を縫い合わせたような継ぎ目が走る。
    腐敗は進行しておらず、個体ごとに顔立ち、体格、髪型、メイド服の着こなしが異なる。
    生前男性だった者も、レギオンとして再生すると女性の肉体へ変化する。
  personality: >-
    群体全体としてはジェワール邸の維持とシューノの保護を最優先する、勤勉で現実的な使用人。
    一方、各個体は生前から続く好み、感情、価値観、シューノへの距離感を持つ。
    共有意志は人格を消す命令系統ではなく、全員が同じ会議室へ常時接続されているようなもの。
    意見が割れることも、少数派が不服を申し立てることもあり、ときには複数個体が結託してシューノを羽交い締めにし、決定を覆させようとする。
  age: "個体ごとに異なる"
  age_detail: 領域内で死亡し、レギオンへ加わった時期も享年も個体ごとに異なる。
  sex:
    body: すべて女性
    identity: 個体ごとに異なる
    target: 個体ごとに異なる
    detail: >-
      再生後の肉体は一律に女性型となる。生前男性だった個体にはTSが起こるが、記憶と個別人格は失われない。
      新しい身体への受け止め方も個体ごとに異なり、共有意志によって一つへ統一されることはない。
  species:
    base: 人間
    current: リビングデッドの群体
    trait: 共有意志と個別意志の併存
    detail: >-
      全個体が実体を持つ。意識と記憶の一部を共有しながら、各個体は独立した人格と身体を維持する。
      群体としての「わたくしたち」と、個人としての「わたし」は同時に成立している。
  affiliation:
    organization: ジェワール墓場
    title: ジェワール邸使用人
    master: シューノ・ジェワール
    detail: 幽霊屋敷ジェワール邸の家事、警備、来訪者対応、墓地管理を担う。
  ability:
    - 群体共有意志: 視聴覚、警戒情報、方針を群体内で共有する。距離が離れていても連携できる。
    - 個別人格: 各個体は共有意志から独立して考え、反対し、嘘をつき、単独で行動できる。
    - リビングデッドの実体: 縫合痕のある肉体を持ち、物品の操作、戦闘、家事労働を行える。
    - 令息への接触: シューノのマナから生まれたため、通常の人間には触れられない彼を掴み、運び、拘束することができる。
    - 増員: シューノの領域内で人間が死亡すると、死者は女性型の新たな個体として群体へ接続される。
status:
  alcohol:
    value: "個体差"
    detail: 酔いやすさも酒の好みも個体ごとに異なる。酔った感覚まで共有するかどうかは本人が選べる。
  cooking:
    value: "70"
    detail: 群体として多数の生前知識を蓄積しているため、日常的な調理と給仕に長ける。
    taste: 個体差。献立会議はしばしば紛糾する。
  combat:
    value: "可変"
    detail: >-
      個体単独では一般的な武装使用人程度だが、人数、共有視界、包囲、死角のない連携によって脅威度が上昇する。
      シューノを傷つけるより、取り囲んで捕縛し、要求を呑ませることを得意とする。
background:
  - シューノ・ジェワールの領域内で死亡した者たちからなる。
  - 最初の個体が誰であったか、現在の群体内でも認識が一致していない。
  - 新たな死者は女性型の継ぎ接ぎの肉体を得て、共有意志へ接続される。
  - 共有意志への接続後も、生前の記憶と個別人格は保持される。
  - シューノは全個体について、現在の名前と生前の名前を記憶している。
  - 増員を望まないシューノに代わり、墓場の警備、救難、来訪者の退去勧告も行う。
  - シューノの判断が自己犠牲的すぎる場合には合議し、複数個体で彼を物理的に制圧することがある。
relations:
  - target: シューノ・ジェワール
    content: >-
      主人であり、群体を生み続ける力の源であり、放っておけば一人で責任を背負い込む少年。
      敬愛、同情、反発、怒りなど、個体ごとに感情は異なる。必要と判断すれば全員で捕まえる。
  - target: レギオン・オブ・ジェワール
    content: >-
      わたくしたちは一つであり、一人ずつでもある。他の個体の記憶を知ることと、その痛みを理解することは同じではない。
  - target: 生者
    content: >-
      客人であり、救難対象であり、未来の同僚になり得る者。シューノが増員を嫌うため、危険な来訪者もまず生きたまま追い返す。
  - target: ミルフィッカ兄弟
    content: 狩船の管理企業。墓場の封鎖表示と、死亡事故を減らすための最低限の連絡は維持している。
speech:
  first_person:
    collective: わたくしたち
    individual: わたし
  second_person:
    default: あなた
    shuno: シューノ様
  style:
    - 群体として話すときは、複数個体が同じ内容をわずかにずれた声で口にする
    - 個人として話すときは、口調も語彙も生前の人格に応じて異なる
    - 使用人としての丁寧さは共有するが、意見の一致までは保証されない
    - 合議中は一人の発言へ別個体が訂正や反論を差し挟む
  sample_lines:
    - "お帰りなさいませ、シューノ様。わたくしたちは、本日の無謀な外出に反対いたします。"
    - "全員の意見ではありません。――訂正します。現時点では、八割六分の意見です。"
    - "わたしの昔の名前を、あの方はまだ覚えている。今の名前も、同じように呼んでくださる。"
    - "生きてお帰りくださいませ。ここで席を増やすことを、主は望んでおりません。"
    - "三名は扉を。二名は腕を。残りは説得を続けます。シューノ様、どうか観念なさってください。"
