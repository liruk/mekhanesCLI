design:
  concept: 継ぎ接ぎの実体と多声的な意志を持つ、増殖するメイド姿のリビングデッド群体。
  shared_features:
    - メイド服
    - パッチワークめいた肌と縫合痕
    - 腐敗のない実体
    - 個体ごとに異なる顔立ちと体格
  outfit:
    primary: 黒と白のメイド服
    notes:
      - 基本意匠は共通だが、丈、袖、エプロン、小物は個体ごとに異なる
      - 生前の職業や好みを示す私物を一つだけ身につける個体が多い
      - 戦闘時もメイド服を崩さない
  palette:
    main: 墨黒
    cloth: 生成りの白
    skin: 灰白、淡い褐色、くすんだ桃色など個体差
    stitch: 暗赤色
