name: 禽露・朱華
reading: "きんろ・はねず"
aliases:
  - ハネズ
  - ハネちゃん
  - Kinro-Hanezu
  - シンセヒーロー
profile:
  birth_year: "3814頃"
  age: "17"
  age_detail: 星間歴3831年時点で17歳。正確な誕生日は未設定。
  appearance: >-
    色白で線の細い17歳の少女。黒髪を高いポニーテールに結び、鮮烈な赤のメッシュを入れている。
    下顔面を覆う黒いフェイスマスクを着け、目元には歌舞伎の隈取りを思わせる赤い化粧が走る。
    黒いシャツに赤いリボン、黒いショートスカートを合わせ、腰には帯を意識した幅広の赤いベルトを締める。
    赤いサイハイ足袋、手先から二の腕までを覆う赤いアームカバー、腿の黒いベルトを着用する。
    腰帯と腿ベルトには、刃のエッジにピンクの光が走るサイバー風クナイを携行する。
  personality: >-
    負けず嫌いで上昇志向が強い。生まれつきの音楽的な勘に加え、後ろ盾のないストリートで
    生き延びるために、作詞・作曲・歌唱・観客の掴み方を磨いてきた努力家。
    天然の売れっ子であるリストリィを一方的にライバル視している。
  occupation: シンガーソングライター系アイドル
  sex:
    body: 女性
    identity: 女性
    target: 未設定
    detail: 恋愛指向は未設定。
status:
  affiliation:
    current: スペクトラム・メディア
    former: 無所属のストリートアーティスト
    detail: >-
      後ろ盾を持たないことが極めて危険な社会で、無所属のまま路上活動を続けていたところを
      スペクトラム・メディアにスカウトされた。
  public_image:
    title: シンセヒーロー
    detail: 近未来くノ一の意匠と、自作曲で道を切り開く姿を重ねたステージ上の異名。
background:
  - 両親の顔を知らず、家族に関する確かな記憶も持っていない。
  - 無所属のストリートアーティストとして、自作曲を武器に危険な環境を生き延びてきた。
  - その才能と生存力をスペクトラム・メディアに見出され、所属アイドルとしてスカウトされた。
  - 天性の人気を持つリストリィ・グランツウォッチを、一方的にライバル視している。
  - 幻想公司所属の白瀬川ありかは朱華のファンであり、時折遊びに来る友人でもある。
relations:
  - target: リストリィ・グランツウォッチ
    content: >-
      一方的にライバル視している天然の売れっ子アイドル。朱華にとっては、努力だけでは届かない
      「持っている者」の象徴でもあるが、リストリィ本人が競争をどう捉えているかは未設定。
  - target: 白瀬川ありか
    content: >-
      幻想公司所属の友人であり、自分のファン。時折遊びに来るありかには、ステージ上ほど尖らずに接する。
  - target: スペクトラム・メディア
    content: >-
      路上から朱華を拾い上げた現在の所属企業。安全と活動基盤を与えた後ろ盾である一方、
      企業アイドルとしての売り方との距離感は今後の物語で定める。
