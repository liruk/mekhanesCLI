design:
  concept: 白い喪服のような貴族衣装をまとい、死者を増やす力に苦しむ中性的な幽霊令息。
  body:
    apparent_age: 14歳
    type: 白い半透明のマナ霊体
    visible_features:
      - 白いミディアムヘア
      - 中性的で少女にも見える顔立ち
      - 淡く透ける白い肌
      - 足元ほど輪郭が薄くなる
  outfit:
    primary: 白い古風な貴族衣装
    notes:
      - フリルや細いリボンを用いるが、明確に少年用の仕立て
      - 装飾は白銀で統一
      - 汚れも血痕もなく、死亡時の姿を理想化したように整っている
  palette:
    main: 霊白
    accent: 白銀
    shadow: 淡い青灰
    eyes: 薄い青紫
