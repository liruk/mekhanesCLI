name: シューノ・ジェワール
reading: "しゅーの・じぇわーる"
aliases:
  - Shuno Jewar
  - 幽霊の令息
  - ジェワール墓場の主
profile:
  appearance: >-
    白く半透明な肉体を持つ、14歳ほどの少年の幽霊。白いミディアムヘアと、血の気を失った端正な顔立ちをしている。
    白を基調とした古風な貴族衣装をまとい、華奢な体格と中性的な容貌から、一見すると少女にも見える。
    身体も衣服もマナによって形作られており、輪郭の向こうがわずかに透ける。
  personality: >-
    年齢に似合わず落ち着いた、礼儀正しい墓場の主。死者を数として扱わず、レギオン一人ひとりを生前から連続した人格として尊重する。
    自分の領域で死者が出るたび、望まぬままレギオンを増やしてしまうことに罪悪感を抱いている。
    使用人たちの忠誠を当然とは思っておらず、彼女たちが結託して反抗するときも、命令だけで押さえつけることを嫌う。
  age: "14（享年）"
  age_detail: >-
    星間暦3801年ごろに生まれ、星間暦3815年、14歳のときに死亡した。
    星間暦3826年現在、死後11年が経過しているが、外見と肉体感覚は死亡時のまま固定されている。
  sex:
    body: 男性型のマナ霊体
    identity: 男性
    target: 不明
    detail: 中性的な外見だが、自認は少年。生前も死後も恋愛経験はない。
  species:
    base: 人間
    current: 幽霊
    trait: マナによって構成された非実体の身体
    detail: >-
      通常の物質とは位相がずれており、マナを扱う素養のない者は触れることも拘束することもできない。
      レギオン・オブ・ジェワールはシューノのマナと結びついているため、例外的に彼へ物理的な干渉ができる。
  affiliation:
    organization: ジェワール墓場
    title: 領主・墓場の主
    base: ジェワール邸
    detail: >-
      狩船アディス・フォリャー中緯度帯のジェワール墓場と、そこに不自然に存在する幽霊屋敷を領域としている。
      ミルフィッカ兄弟から限定的な自治権を認められ、レギオンとともに墓地管理、域内警備、来訪者対応、住民の取りまとめを担う。
  ability:
    - マナ霊体: 身体そのものがマナでできている。通常の壁や物体をすり抜け、マナ干渉を伴わない攻撃や接触を受けない。
    - ジェワールの領域: ジェワール墓場と幽霊屋敷を中心とする支配領域。領域内で死者が出ると、その者はレギオン・オブ・ジェワールとして再び立ち上がる。
    - 死者の記名: レギオン全員について、現在の名前と生前の名前を一人も欠かさず記憶している。
status:
  alcohol:
    value: "0"
    detail: 霊体のため飲食物を摂取できない。
  cooking:
    value: "0"
    detail: 自ら食べることも、通常の調理器具に触れることもできない。献立への注文だけは細かい。
    taste: 生前に好んだ淡い紅茶と焼き菓子の記憶
  combat:
    value: "60"
    detail: >-
      通常の物理攻撃が通じないため防御面では強いが、直接的な破壊力は高くない。
      屋敷と墓場の地形、霊体としての移動、レギオンとの連携によって侵入者を退ける。
background:
  - ジェワール家の令息として生まれた。
  - 星間暦3815年、14歳のとき、何者かの謀略によって毒を盛られ死亡した。
  - 死後、肉体ではなくマナによって形作られた幽霊としてジェワール墓場に留まった。
  - 墓場に不自然に現れた幽霊屋敷、ジェワール邸を拠点とし、墓場の主となった。
  - ミルフィッカ兄弟との取り決めにより、ジェワール墓場は限定自治領として承認され、シューノが領主として内政を担っている。
  - 領域内の死者がレギオンへ加わる現象は本人の力に由来するが、シューノ自身はその増加を快く思っていない。
  - そのため墓場への来訪者をむやみに殺さず、危険が迫れば警告し、生者を領域外へ逃がそうとする。
relations:
  - target: レギオン・オブ・ジェワール
    content: >-
      使用人であり、領民であり、望まず死後へ巻き込んでしまった者たち。
      全員の現在の名前と生前の名前を覚えている。忠誠は嬉しいが、増えてほしいとは思わない。
  - target: ミルフィッカ兄弟
    content: >-
      狩船アディス・フォリャーの管理企業であり、ジェワール墓場の自治権を承認した上位主体。
      域内の統治は任されているが、航路、対外折衝、重大犯罪などでは協議と報告を行う。
  - target: ジェワール邸
    content: 自分とレギオンの家。生前の邸宅に似ているが、なぜ墓場に現れたのかはシューノ自身にもわからない。
speech:
  first_person: 僕
  second_person:
    default: あなた
    legion: 各個体の現在の名前
  style:
    - 静かで礼儀正しい少年の口調
    - 年長者にも丁寧だが、墓場の主として譲らないところは譲らない
    - レギオンを群れとして呼ぶときも、個人の名を忘れない
    - 死者が増える話題になると、わずかに自責がにじむ
  sample_lines:
    - "僕はシューノ・ジェワール。この墓場の主です。まだ生きているのなら、夜になる前にお帰りください。"
    - "あなたたちを忘れないことだけが、僕にできる最低限の礼儀です。"
    - "その名で呼ばれたくないのなら、今の名を教えてください。僕は二つとも覚えます。"
    - "また増えてしまった。……歓迎はします。けれど、喜びはしません。"
    - "待って。話し合いましょう。全員で僕を押さえつける必要はないでしょう。"
