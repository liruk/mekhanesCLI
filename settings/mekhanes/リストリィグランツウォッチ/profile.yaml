  - シルヴィアナ・メギルクロックとは幼馴染で、リストリィのほうが一歳年上。
  - 年下の男性を好み、その嗜好がこじれた末にシルヴァー・ウェーブの令息へ手を出す。
  - 令息との一件を契機に指名手配され、逃亡生活へ入る。
  - 実家とは縁を切ったつもりでいるが、シルヴィアナとの関わりは切れなかった。
