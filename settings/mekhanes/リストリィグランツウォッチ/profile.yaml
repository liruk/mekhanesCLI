  age_detail: 星間歴3831年時点で22歳。シルヴィアナ・メギルクロックより一歳年上。
  appearance: >-
    ロングのストレートブロンドと青い瞳を持つ、胸の大きな成人エルフの女性。
    青い革のオープンフロント・フロントレーシング仕様のクロップドビスチェを、
    胴体を覆う不透明な濃紺のインナースーツの上に着用する。
    青いフリルスカートの背面から長いリボンが伸び、足元は青いニーブーツ。
    指名手配後も右手首には手錠が掛かったままで、もう一方の輪を短い鎖から垂らしている。
  personality: >-
    楽天的。企業間問題と指名手配という深刻な状況でも悲壮感を長続きさせず、
    愛嬌と勢いで窮地を切り抜けようとする。実家の権威を嫌って縁を切ったつもりでいる一方、
    幼馴染のシルヴィアナとの関係だけは捨てきれない。
  ability:
    - "【交渉：カリスマ】": アイドルとして培った存在感と話術で人の注意を集め、場の流れを自分へ引き寄せる。
    - "【交渉：色仕掛け】": 魅力と距離感を意識的に使い、相手の警戒や判断を鈍らせる。
    - "【拘束】": 右手首に残った手錠と鎖を用い、相手の手首、武器、衣服や周囲の構造物へ絡めて動きを封じる。
    - "【鞭術】": 鞭へマナをまとわせ、間合いの制圧、牽制、武器落とし、拘束を行う。
    - "【エナジー・バレット】": マナを弾丸状に射出する遠距離攻撃。拘束や鞭術で生じた隙を突くために使う。
