  design:
    era: 成人体型を基準とする
    hair:
      color: 淡いオレンジ
      style: 自然な束感と軽いサイドパートのある、動きやすいショートヘア
    eyes:
      color: ヘーゼル
      detail: 暖かな茶・琥珀色に、わずかなオリーブ色を含む虹彩
    skin: 色白
    physique:
      proportions: 成人女性の均整を持つ、細身で動きやすい体型
