        detail: 局所的な内部光。炎や魔法のオーラではない
      hands: 左右とも五指を持つ人型の可動手
    art:
      style: 紅恭也の設定画と同一シリーズのメーカネース合格画風。整理されたアニメ的な顔、滑らかな段階陰影、明瞭な素材差を重視
      setting_sheet: 砂原海白花_設定画_半サイバネ_v2.png
