      right:
        material: 淡いアイボリーホワイトの技術用セラミック
        design: 滑らかで丸みのある装甲殻。耐久性と打撃力を重視
      left:
        material: ガンメタルおよび研磨鋼
        design: 鋭角的な板金と刃状の稜線を持つ、切削的で攻撃的な構造
      joints:
